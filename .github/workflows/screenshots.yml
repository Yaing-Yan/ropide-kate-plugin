name: Screenshots

# 无头渲染 RopIDE 工具面板的各个标签页，产出 PNG。
#
# 说明：Actions 的日志 / artifact 下载走的是 githubusercontent.com、blob.core.windows.net
# 等域名，受限网络里取不到，因此这里把构建日志与截图直接提交回当前分支（shots/ 与
# ci-shots.log），用 git 就能拿到。工作流自身产生的提交（actor = github-actions[bot]）
# 会被 job 上的 if 跳过，不会自触发。
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']

jobs:
  shots:
    name: Render UI screenshots (Arch Linux)
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    container:
      image: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          set -o pipefail
          pacman -Syu --noconfirm --needed \
            git cmake make gcc gdb \
            qt6-base \
            kcoreaddons kconfig ki18n ktexteditor kxmlgui \
            noto-fonts noto-fonts-cjk noto-fonts-emoji \
            ttf-dejavu ttf-liberation adobe-source-code-pro-fonts 2>&1 | tail -20

      - name: Checkout ropide-kate-plugin
        uses: actions/checkout@v4

      - name: Configure
        run: |
          set -o pipefail
          cmake -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee -a ci-shots.log

      - name: Build
        run: |
          set -o pipefail
          cmake --build build -j"$(nproc)" --target ropidekate ropide-shot-host 2>&1 | tee -a ci-shots.log

      - name: Render screenshots
        run: |
          set -o pipefail
          mkdir -p shots
          QT_QPA_PLATFORM=offscreen \
            ./build/ropide-shot-host "$PWD/build/ropidekate.so" "$PWD/shots" 2>&1 | tee -a ci-shots.log || {
            echo "== crashed; rerun under gdb ==" | tee -a ci-shots.log
            QT_QPA_PLATFORM=offscreen gdb -batch -ex run -ex "bt 30" \
              --args ./build/ropide-shot-host "$PWD/build/ropidekate.so" "$PWD/shots" \
              2>&1 | tee -a ci-shots.log
            }
          ls -la shots | tee -a ci-shots.log

      - name: Publish screenshots + build log to the branch
        if: always()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # 成功时不保留日志（若之前提交过则移除）；失败时才把日志带上便于排查
          if [ "${{ job.status }}" = "success" ]; then
            git rm -q --cached ci-shots.log 2>/dev/null || true
          else
            git add -f ci-shots.log 2>/dev/null || true
          fi
          git add -f shots 2>/dev/null || true
          git status --short
          if git diff --cached --quiet; then
            echo "nothing to publish"
          else
            git commit -m "CI: screenshots + build log for ${GITHUB_SHA::7}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
