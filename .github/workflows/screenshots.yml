name: Screenshots

# 无头渲染 RopIDE 工具面板的各个标签页，把 PNG 作为 artifact 上传。
# 手动触发：Actions → Screenshots → Run workflow（可选分支）
#   或：gh workflow run screenshots.yml --ref <branch>
# workflow_dispatch 只认默认分支上已存在的工作流，所以在 arena/* 分支上也监听 push。
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']

jobs:
  shots:
    name: Render UI screenshots (Arch Linux)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git cmake make gcc \
            qt6-base \
            kcoreaddons kconfig ki18n ktexteditor kxmlgui \
            noto-fonts noto-fonts-cjk noto-fonts-emoji \
            ttf-dejavu ttf-liberation adobe-source-code-pro-fonts

      - name: Checkout ropide-kate-plugin
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)" --target ropidekate ropide-shot-host

      - name: Render screenshots
        run: |
          mkdir -p shots
          QT_QPA_PLATFORM=offscreen \
            ./build/ropide-shot-host "$PWD/build/ropidekate.so" "$PWD/shots"
          ls -la shots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ropide-screenshots
          path: |
            shots/*.png
          if-no-files-found: error
